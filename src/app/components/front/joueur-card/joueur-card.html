<article class="card h-100 shadow-sm carte-joueur" [class.carte-indisponible]="!joueur().disponible">
  <img class="card-img-top joueur-img" [src]="joueur().image" [alt]="joueur().nom" />
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <span class="badge text-bg-secondary">{{ joueur().poste }}</span>
      <span [class]="{ badge: true, 'text-bg-success': joueur().disponible, 'text-bg-danger': !joueur().disponible }">
        {{ joueur().disponible ? 'Disponible' : 'Indisponible' }}
      </span>
    </div>
    <h5 class="card-title mb-1">{{ joueur().nom }}</h5>
    <p class="fw-bold fs-5 text-success mb-3">{{ joueur().prix | prixMillion }}</p>
    <div class="mt-auto d-flex gap-2">
      <a class="btn btn-sm btn-outline-dark flex-grow-1" [routerLink]="['/catalogue', joueur().id]">Détails</a>
      <button type="button" class="btn btn-sm btn-success flex-grow-1" [disabled]="!joueur().disponible"
        (click)="acheter.emit(joueur())">
        <i class="bi bi-cart-plus"></i> Recruter
      </button>
    </div>
  </div>
</article>
