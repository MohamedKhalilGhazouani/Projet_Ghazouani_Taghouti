<div class="d-flex flex-column flex-lg-row min-vh-100">
  <aside class="admin-sidebar text-white p-3 d-flex flex-column" style="background-color: #06281f">
    <a class="navbar-brand fw-bold text-white mb-3" routerLink="/admin/dashboard">
      <i class="bi bi-dribbble text-warning"></i> Mercato<span class="text-warning">Foot</span>
      <span class="badge text-bg-warning ms-1">Admin</span>
    </a>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active">
          <i class="bi bi-speedometer2 me-2"></i> Tableau de bord
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/joueurs" routerLinkActive="active">
          <i class="bi bi-people me-2"></i> Joueurs
        </a>
      </li>
    </ul>
    <hr class="border-secondary" />
    <div class="small">
      <div class="mb-2"><i class="bi bi-person-circle me-1"></i> Connecté : <strong>{{ admin()?.login }}</strong></div>
      <button class="btn btn-sm btn-outline-warning w-100" (click)="seDeconnecter()">
        <i class="bi bi-box-arrow-right"></i> Se déconnecter
      </button>
    </div>
  </aside>
  <div class="flex-grow-1 d-flex flex-column bg-light">
    <header class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
      <span class="fw-semibold text-secondary"><i class="bi bi-shield-lock me-1"></i> Espace administrateur</span>
      <a class="btn btn-sm btn-outline-secondary" routerLink="/catalogue/liste">
        <i class="bi bi-box-arrow-up-right"></i> Voir le site
      </a>
    </header>
    <main class="flex-grow-1 p-4"><router-outlet /></main>
  </div>
</div>
