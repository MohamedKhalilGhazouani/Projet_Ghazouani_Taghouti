<div class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #06281f">
    <div class="container">
      <a class="navbar-brand fw-bold" routerLink="/catalogue">
        <i class="bi bi-dribbble text-warning"></i> Mercato<span class="text-warning">Foot</span>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPublic"
